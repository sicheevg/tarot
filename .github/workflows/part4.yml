name: Part 4 - reliability fixes
on:
  push:
    branches: [main]
    paths: ['.github/workflows/part4.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch and verify source
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, re
          p=pathlib.Path('index.html')
          text=p.read_text()
          marker='<script src="./part4.js?v=4"></script>'
          if marker not in text:
              actual=subprocess.check_output(['git','hash-object','index.html'],text=True).strip()
              if actual!='486444181b4d19ce32fa4e1603e667ff32a803bd':
                  raise SystemExit('Unexpected index revision; stopped without overwriting')
              old="H=H.map(r=>({...r,id:String(r.id),q:r.q||'',local:r.local||''})).filter(valid);"
              fixed="H=H.filter(r=>r&&typeof r==='object').map(r=>({...r,id:String(r.id),q:r.q||'',local:r.local||''})).filter(valid);"
              if text.count(old)!=1 or text.count('</body>')!=1:
                  raise SystemExit('Unexpected initialization or HTML structure')
              text=text.replace(old,fixed).replace('</body>',marker+'</body>')
              p.write_text(text)
          assert '<script src="./part2.js?v=2"></script>' in text
          assert 'id="telegram-art"' in text
          assert text.count(marker)==1
          scripts=re.findall(r'<script>(.*?)</script>',text,re.S)
          main=[s for s in scripts if "const N=" in s]
          assert len(main)==1
          pathlib.Path('/tmp/part4-base.js').write_text(main[0])
          PY
          node --check /tmp/part4-base.js
          node --check part2.js
          node --check part4.js
          node part4.test.cjs
      - name: Commit fixes
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Part 4: enable reliability fixes'
            git push origin HEAD:main
          fi
      - name: Request Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/pages/builds
