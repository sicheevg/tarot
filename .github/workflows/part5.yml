name: Part 5 - final fixes and browser verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/part5.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply guarded fixes
        run: |
          python3 - <<'PY'
          import pathlib, subprocess
          p=pathlib.Path('part4.js'); text=p.read_text()
          h=pathlib.Path('index.html'); html=h.read_text()
          if "function partial(job,label,text)" not in text:
              if subprocess.check_output(['git','hash-object','part4.js'],text=True).strip()!='3318bbf3c523d465de93de1646b8325c3ff92931':
                  raise SystemExit('Unexpected part4.js revision')
              changes=[('async function chain(', "function partial(job,label,text){alive(job);if(!H.some(r=>r.id===job.rec.id))return;job.received.push({label,text});job.rec.ai='Частичный результат. Получены ответы: '+job.received.map(r=>r.label).join(', ')+NL+NL+job.received.map(r=>r.label+NL+r.text).join(NL+NL);save();$('online').textContent=job.rec.ai+NL+NL+'Остальные модели ещё отвечают…'}\nasync function chain("), ('alive(job);return{label,text}', 'alive(job);partial(job,label,text);return{label,text}'), ('cancel:null};active=job', 'cancel:null,rec,received:[]};active=job'), ("if(job.active)el.textContent='ИИ-чтение недоступно: '+String(e?.message||e)+'. Встроенное толкование сохранено. Для входа используйте «Подключить Puter» в меню ☰.'", "if(job.active)el.textContent=job.received.length?job.rec.ai+NL+NL+'Ожидание завершено: '+String(e?.message||e):'ИИ-чтение недоступно: '+String(e?.message||e)+'. Встроенное толкование сохранено. Для входа используйте «Подключить Puter» в меню ☰.'"), ("$('online').textContent='Ожидание ИИ остановлено. Карты и встроенное толкование сохранены.'", "$('online').textContent='Ожидание ИИ остановлено. Карты и полученные ответы сохранены.'+(active.received.length?NL+NL+active.rec.ai:'')")]
              for old,new in changes:
                  if text.count(old)!=1: raise SystemExit('Patch anchor mismatch')
                  text=text.replace(old,new)
              p.write_text(text)
          if 'id="part5-wrap"' not in html:
              if subprocess.check_output(['git','hash-object','index.html'],text=True).strip()!='b06a57dda904f5ec3d5ac20d048bdac1154eb71c':
                  raise SystemExit('Unexpected index.html revision')
              if html.count('</style>')!=1: raise SystemExit('Unexpected style count')
              html=html.replace('</style>','</style><style id="part5-wrap">main{min-width:0}.panel,.text,.entry,summary,#question,#status,#online,#result,#telegram-art{overflow-wrap:anywhere;word-break:normal;min-width:0}</style>',1)
              h.write_text(html)
          assert 'id="telegram-art"' in html
          assert './part2.js?v=2' in html and './part4.js?v=4' in html
          PY
          node --check part2.js
          node --check part4.js
          node part4.test.cjs
      - name: Install browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Test complete application in Chromium
        run: node part5.test.cjs
      - name: Commit verified fixes and report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html part4.js audit-results.json
          if ! git diff --cached --quiet; then
            git commit -m 'Part 5: verified long-text and partial-answer fixes'
            git push origin HEAD:main
          fi
      - name: Request Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/pages/builds
