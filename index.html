<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Таро"><meta name="theme-color" content="#10091c"><link rel="apple-touch-icon" href="./apple-touch-icon.png"><link rel="manifest" href="./manifest.webmanifest"><title>Таро Марсель</title><style>
:root{--bg:#10091c;--a:#d8b366}*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;padding:calc(env(safe-area-inset-top) + 6px) 14px calc(env(safe-area-inset-bottom) + 30px);background:radial-gradient(ellipse at top,#ffffff12,transparent),var(--bg);color:#f7eee0;font:16px Georgia,serif;min-height:100vh}
main{max-width:650px;margin:auto;min-width:0}header{display:flex;align-items:center;gap:8px}h1{flex:1;font-size:19px;letter-spacing:3px;color:var(--a);margin:10px 0}
button,select,input,textarea{font:inherit;border:1px solid var(--a);border-radius:12px;padding:12px;background:#20172b;color:#f7eee0}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.5}select,input,textarea{width:100%;margin:8px 0}
#lang{background:rgba(255,255,255,.08);color:var(--a);border-radius:10px;padding:8px 10px;font-size:13px}#menu{padding:8px 13px}
#telegram-art{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:4px 0 6px;padding:10px 12px;border:1px solid var(--a);border-radius:14px;background:linear-gradient(135deg,#ffffff12,#ffffff03)}
#telegram-art h2{font-size:16px;color:var(--a);margin:0}#telegram-art p{margin:2px 0 0;font-size:13px;opacity:.85;line-height:1.3}#telegram-art a{display:inline-flex;align-items:center;padding:10px 14px;min-height:44px;border-radius:12px;border:1px solid var(--a);color:var(--a);text-decoration:none;font-weight:bold;font-size:15px;white-space:nowrap}
#orn{text-align:center;color:var(--a);letter-spacing:10px;font-size:14px;margin:2px 0}
.ring{display:flex;justify-content:center;margin:4px 0 8px}#orb{border-radius:50%;width:118px;height:118px;font-size:21px;box-shadow:0 0 45px #d8b36655;background:radial-gradient(circle at 35% 30%,#ffffff77,transparent 45%),radial-gradient(circle,var(--a),#23132d 80%);text-shadow:0 2px 4px black;animation:pulse 3s infinite}@keyframes pulse{50%{transform:scale(1.05)}}
.row{display:flex;gap:10px}.row button{flex:1}#status{min-height:18px;text-align:center}
#settings{border:1px solid var(--a);border-radius:14px;padding:12px 14px;margin:8px 0}#settings h3{margin:4px 0;color:var(--a);font-size:16px}summary{color:var(--a);cursor:pointer;padding:10px 0}.small{font:12px/1.5 -apple-system,system-ui,sans-serif;opacity:.78}
#table{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px 0;scroll-margin-top:10px}#table:empty{display:none}.card{aspect-ratio:.55;perspective:900px}.flip{position:relative;width:100%;height:100%;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform .7s}.open .flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;overflow:hidden;border:1px solid var(--a);border-radius:9px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 0 18px #d8b36633}.back{display:grid;place-items:center;font-size:40px;color:var(--a);background:repeating-linear-gradient(45deg,#24172c,#24172c 8px,#362642 9px,#362642 10px)}
.front{transform:rotateY(180deg);background:radial-gradient(ellipse,#32213e,#090810);display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:8px;text-align:center;color:#ebcb89}.front small{font-size:11px}.symbol{font-size:40px}.front img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#ead8b5}.derived{max-width:100px;justify-self:center;width:100%}
.panel,.entry{border:1px solid #ffffff25;border-radius:14px;padding:14px;background:#ffffff07;margin:16px 0}.panel,.text{white-space:pre-wrap;line-height:1.6}
.panel,.text,.entry,summary,#question,#status,#result,#telegram-art{overflow-wrap:anywhere;word-break:normal;min-width:0}
dialog{width:min(92vw,440px);background:#17101f;color:white;border:1px solid var(--a);border-radius:16px}dialog::backdrop{background:#000b}.tools{display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:360px){h1{font-size:16px;letter-spacing:2px}#telegram-art a{padding:8px 12px;font-size:14px}#orb{width:104px;height:104px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main>
<header><h1>ТАРО МАРСЕЛЬ</h1><button id="lang" type="button" aria-label="Switch language / Сменить язык">EN</button><button id="menu" type="button" aria-label="Настройки">☰</button></header>
<aside id="telegram-art" aria-label="Рисунки автора"><div><h2 id="tgTitle">Мои рисунки в Telegram</h2><p id="tgText">Загляните в мой канал с рисунками.</p></div><a id="tgBtn" href="https://t.me/printprintprintprintprintprint" target="_blank" rel="noopener noreferrer">🎨 Смотреть рисунки →</a></aside>
<section id="settings" hidden><h3 id="setTitle">Оформление</h3><select id="theme" aria-label="Theme"></select><p id="offline" class="small"></p><details><summary id="methodTitle">О методе</summary><p id="methodText" class="small"></p></details></section>
<div id="orn"></div>
<div class="ring"><button id="orb" type="button">Гадать</button></div>
<div id="status" class="small" role="status"></div>
<div id="table"></div>
<div class="row"><button id="again" type="button">Гадать снова</button><button id="ask" type="button">Задать вопрос</button></div>
<div id="question" class="small"></div>
<section id="result" class="panel" hidden></section>
<details><summary><span id="histTitle">История</span> <span id="count"></span></summary><input id="search" placeholder="Поиск по вопросу или карте"><div id="history"></div><div class="tools"><button id="export" type="button">Экспорт JSON</button><button id="import" type="button">Импорт</button></div><input id="file" hidden type="file" accept=".json,application/json"></details>
<dialog id="dialog"><h3 id="qTitle">Ваш вопрос</h3><p id="qHint" class="small"></p><textarea id="q" rows="4"></textarea><div class="row"><button id="cancel" type="button">Отмена</button><button id="go" type="button">Гадать</button></div></dialog>
<p id="foot" class="small"></p>
</main>
<script src="./data-ru.js?v=8"></script><script src="./data-en.js?v=8"></script><script src="./engine.js?v=8"></script><script src="./app.js?v=8"></script>
</body></html>
